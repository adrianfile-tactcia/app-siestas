<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>App Siestas</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#214f86" />

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #eef3f8;
    }

    .topbar {
      background: #214f86;
      color: white;
      padding: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      padding: 6px;
    }

    .day {
      background: white;
      border-radius: 8px;
      padding: 4px;
      min-height: 110px;
      font-size: 12px;
    }

    .today {
      border: 2px solid #214f86;
    }

    .slot {
      display: flex;
      flex-direction: column;
      margin-top: 3px;
    }

    input {
      font-size: 12px;
      margin-top: 2px;
    }
  </style>
</head>

<body>

<div class="topbar">
  <button onclick="prevMonth()">◀</button>
  <div id="title">Mes</div>
  <button onclick="nextMonth()">▶</button>
</div>

<div class="calendar" id="calendar"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDDrGbgL17i2KX5W3e0iNilTzWUrIsvgHA",
  authDomain: "app-web-ffea0.firebaseapp.com",
  projectId: "app-web-ffea0",
  storageBucket: "app-web-ffea0.firebasestorage.app",
  messagingSenderId: "1021596773214",
  appId: "1:1021596773214:web:670dab0a531461775abd6f"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const SHARE_ID = "agenda-compartida";

let currentDate = new Date();
let currentMonth = currentDate.getMonth();
let currentYear = currentDate.getFullYear();
let data = {};

const slots = ["mañana", "siesta2", "siesta3", "siesta4", "noche"];

function key(d, s) {
  return `${d}_${s}`;
}

async function save(d, s, value) {
  const ref = doc(db, "shared_calendars", SHARE_ID, "months", `${currentYear}-${currentMonth+1}`);
  data[key(d,s)] = value;

  await setDoc(ref, { values: data }, { merge: true });
}

function load(d, s) {
  return data[key(d,s)] || "";
}

function render() {
  const cal = document.getElementById("calendar");
  cal.innerHTML = "";

  document.getElementById("title").innerText =
    currentYear + " / " + (currentMonth+1);

  const first = new Date(currentYear, currentMonth, 1).getDay();
  const days = new Date(currentYear, currentMonth+1, 0).getDate();

  for (let i=0;i<first;i++) cal.innerHTML += "<div></div>";

  for (let d=1; d<=days; d++) {
    const div = document.createElement("div");
    div.className = "day";

    if (
      d === new Date().getDate() &&
      currentMonth === new Date().getMonth()
    ) {
      div.classList.add("today");
      setTimeout(()=>div.scrollIntoView({behavior:"smooth"}),200);
    }

    div.innerHTML = "<b>"+d+"</b>";

    slots.forEach(s=>{
      const inp = document.createElement("input");
      inp.value = load(d,s);
      inp.onchange = e=> save(d,s,e.target.value);
      div.appendChild(inp);
    });

    cal.appendChild(div);
  }
}

function watch() {
  const ref = doc(db, "shared_calendars", SHARE_ID, "months", `${currentYear}-${currentMonth+1}`);

  onSnapshot(ref, snap=>{
    data = snap.exists() ? snap.data().values || {} : {};
    render();
  });
}

window.prevMonth = function() {
  currentMonth--;
  if (currentMonth<0){currentMonth=11;currentYear--;}
  watch();
}

window.nextMonth = function() {
  currentMonth++;
  if (currentMonth>11){currentMonth=0;currentYear++;}
  watch();
}

watch();
</script>

</body>
</html>
